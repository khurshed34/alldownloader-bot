
name: TurboSave Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: turbosave-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    name: Run TurboSave
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --upgrade yt-dlp==2026.10.26
          yt-dlp --version

      - name: Run TurboSave Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python main.py
