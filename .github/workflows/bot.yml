
name: TurboSave Telegram Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: turbosave-telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Install Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-cache-dir --upgrade yt-dlp

      # 5. Check installations
      - name: Check environment
        run: |
          python --version
          yt-dlp --version
          ffmpeg -version

      # 6. Run Telegram bot
      - name: Run TurboSave
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AUDD_API_TOKEN: ${{ secrets.AUDD_API_TOKEN }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py
